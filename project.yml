name: CapsAwake
options:
  bundleIdPrefix: com.gaijindev
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  CapsAwakeCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CapsAwakeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaijindev.CapsAwakeCore
        GENERATE_INFOPLIST_FILE: YES
  CapsAwake:
    type: application
    platform: macOS
    sources:
      - path: Sources/CapsAwakeApp
    dependencies:
      - target: CapsAwakeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaijindev.CapsAwake
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CapsAwake.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: CapsAwake
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - CapsAwakeCoreTests
  CapsAwakeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CapsAwakeCoreTests
    dependencies:
      - target: CapsAwakeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaijindev.CapsAwakeTests
        GENERATE_INFOPLIST_FILE: YES
