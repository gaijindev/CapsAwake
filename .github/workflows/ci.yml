name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Format, test, and build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check formatting
        run: ./Scripts/check-format.sh
      - name: Run Swift Package tests
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test Xcode app
        run: >-
          xcodebuild -project CapsAwake.xcodeproj -scheme CapsAwake
          -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Build Universal release app
        run: CONFIGURATION=Release DERIVED_DATA_PATH="$PWD/.build/xcode" ./Scripts/build-app.sh
      - name: Verify Universal architectures
        run: >-
          lipo .build/xcode/Build/Products/Release/CapsAwake.app/Contents/MacOS/CapsAwake
          -verify_arch arm64 x86_64
